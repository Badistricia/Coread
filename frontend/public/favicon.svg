<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Rounded Card Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Open Book Group -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Left Cover Backing -->
    <path d="M 256,136 C 196,118 114,124 88,136 L 88,358 C 114,346 196,340 256,358 Z" fill="#3730A3"/>
    <!-- Right Cover Backing -->
    <path d="M 256,136 C 316,118 398,124 424,136 L 424,358 C 398,346 316,340 256,358 Z" fill="#3730A3"/>

    <!-- Left Main Page -->
    <path d="M 256,130 C 196,112 116,118 96,130 L 96,350 C 116,338 196,332 256,350 Z" fill="url(#pageGrad)"/>
    <!-- Right Main Page -->
    <path d="M 256,130 C 316,112 396,118 416,130 L 416,350 C 396,338 316,332 256,350 Z" fill="url(#pageGrad)"/>

    <!-- Center Fold Line -->
    <line x1="256" y1="130" x2="256" y2="350" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Page Text Lines -->
    <line x1="132" y1="175" x2="220" y2="165" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="132" y1="215" x2="220" y2="205" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="132" y1="255" x2="220" y2="245" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="132" y1="295" x2="190" y2="288" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

    <!-- Right Page Text Lines -->
    <line x1="292" y1="165" x2="380" y2="175" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="292" y1="205" x2="380" y2="215" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="292" y1="245" x2="380" y2="255" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <line x1="292" y1="288" x2="350" y2="295" stroke="#94A3B8" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

    <!-- Bookmark Ribbon -->
    <path d="M 256,130 L 256,220 L 274,205 L 292,220 L 292,130 Z" fill="url(#accentGrad)" opacity="0.95"/>

    <!-- AI Sparkle Stars -->
    <path d="M 360,110 L 364,124 L 378,128 L 364,132 L 360,146 L 356,132 L 342,128 L 356,124 Z" fill="#FBBF24"/>
    <path d="M 150,105 L 152.5,114 L 161.5,116.5 L 152.5,119 L 150,128 L 147.5,119 L 138.5,116.5 L 147.5,114 Z" fill="#FBBF24" opacity="0.8"/>
  </g>
</svg>